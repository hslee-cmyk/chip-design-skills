# 판정 실행(V1·red 수집)의 유일한 pytest 설정(05-role-separation design §13.1 ①, review35 M4-01).
# auditor는 격리 복제본 루트에서 `-c <gate master 캐시>/pytest_gate.ini --rootdir=<복제본 루트>
# --confcutdir=<복제본 루트>`로 부른다(§12-7). test-author 경로 밖과 code-author의 tests/tools/는 수집하지 않는다.
[pytest]
testpaths = skills/analog-gmid-design/assets/tests
norecursedirs = tools

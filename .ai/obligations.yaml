# 프로젝트 의무(obligation) — chip-design-skills
# 의무 = 이 프로젝트에서 반복해야 하는 절차·출력 항목. 일반 지식이 아니므로 ai-memory 장기기억으로 승격하지 않는다.
# 장치(hook·파서)는 ai-memory hooks/ob_*.py가 제공한다: 입력 시 주입(prompt_any) · 압축 직후 재주입 · 응답 끝 점검(response_re).
# 필수 항목은 사본을 두지 않고 정본 문서에서 파싱한다(required.from). 형식: ai-memory hooks/ob_common.py 머리말.
version: 1
obligations:
  - id: report-bundle
    status: active
    source: "원칙 26. 사용자 2026-10-12 '항상 bkit 순서대로 진행했는지를 보고해', 10-22 '내가 보고 하라고 한 것은 반드시 보고해', 10-26 '권고만들때 보고사항 보고해' 외 — 누락 재발 5회(2026-11-12 분석)"
    prompt_any: [권고, 보고, 승인, 결정, 어떻게 됐, 진행 상황, 병합, 정리해, 질문]
    response_re: "\\(Recommended\\)|할까요\\?|승인(할|해|하시|을)|권고(안|합니다|대로)|결정(해 주|이 필요|을 부탁)"
    required:
      from:
        file: .claude/skills/report-bundle/SKILL.md
        block_start: "^26\\.\\s"
        item_re: "^\\s+\\d+\\.\\s+\\*\\*(.+?)\\*\\*"
    note: "양식·칸 규칙은 skill report-bundle(원칙 26). 질문 도구 경로는 ask_gate가 따로 강제한다."

  - id: o229-la1-sprint
    status: active
    until: "card LA-1a + LA-1 병합(그 뒤 LA-1 재점검 O-225로 넘어감)"
    source: "사용자 2026-11-04 '원인규명이 가능한 정도로 테스트를 축소해서 하고, LA-1구현할 때까지는 …'"
    note: "원문 = .claude/rules/o229-la1-sprint.md (상시 로드). 이 항목은 수명 관리용이다."
